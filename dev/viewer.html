<!DOCTYPE html>

<html><head><meta charset="utf-8"><title>Gun model viewer</title>
<style>html,body{margin:0;background:#5a6b7d;overflow:hidden} canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"../node_modules/three/build/three.module.js","three/addons/":"../vendor/three-addons/"}}</script>
</head><body>
<script type="module">import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { buildGunModel } from '../gun-model.js';
const W = innerWidth, H = innerHeight;
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(W, H); renderer.setPixelRatio(1);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.setScissorTest(true); renderer.setClearColor(0x5a6b7d);
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;
const key = new THREE.DirectionalLight(0xfff1e0, 2.4); key.position.set(-1.5, 3, 1.5); key.castShadow = true;
key.shadow.mapSize.set(2048, 2048); Object.assign(key.shadow.camera, { left: -1, right: 1, top: 1, bottom: -1, near: 0.1, far: 8 }); key.shadow.bias = -0.0005; key.shadow.normalBias = 0.01;
scene.add(key);
scene.add(new THREE.HemisphereLight(0xdfe8ff, 0x3a3028, 0.6));
const g = buildGunModel({ cache: false }); scene.add(g.root); await g.handReady; console.log('hand', JSON.stringify(g.handStats));
const p = new URLSearchParams(location.search);
const views = (p.get('views') || 'left,right,back,top').split(',');
const T = new THREE.Vector3(0, 0.0, 0.45);
const pos = { left: [5.2, 0.2, 0.4], right: [-5.2, 0.2, 0.4], back: [1.2, 1.4, -4.6], top: [0.3, 3, 0.2], front: [0.4, 0.4, 3], game: [-1.2, 0.9, -2.6], under: [1, -2, 1] };
if (p.get('zoom')) { const z = +p.get('zoom'); for (const k in pos) pos[k] = pos[k].map((v, i) => T.getComponent(i) + (v - T.getComponent(i)) / z); }
const cols = Math.ceil(Math.sqrt(views.length)), rows = Math.ceil(views.length / cols);
views.forEach((v, i) => {
  const w = W / cols, h = H / rows, x = (i % cols) * w, y = H - (Math.floor(i / cols) + 1) * h;
  const cam = new THREE.PerspectiveCamera(22, w / h, 0.01, 50);
  cam.position.set(...pos[v]); cam.lookAt(T);
  renderer.setViewport(x, y, w, h); renderer.setScissor(x, y, w, h);
  renderer.render(scene, cam);
});
document.title = 'done';
</script></body></html>
